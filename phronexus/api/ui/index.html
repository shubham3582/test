<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phronexus Console</title>
<style>
  :root {
    /* Light theme (default). Neutrals carry a faint blue bias toward the accent. */
    --bg:#f5f8fd; --panel:#ffffff; --panel2:#eef2f9; --line:#d7deea;
    --fg:#16213c; --muted:#5c6b85; --accent:#2f6fe0; --ok:#12994f; --warn:#b57d0a; --err:#dc2f45;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="dark"] {
    --bg:#0f1420; --panel:#161d2b; --panel2:#1d2636; --line:#2a3446;
    --fg:#e6ebf2; --muted:#8b97ab; --accent:#4f8cff; --ok:#2ecc71; --warn:#f1c40f; --err:#ff5c6c;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--sans); background:var(--bg); color:var(--fg); }
  a { color:var(--accent); }
  button { font-family:var(--sans); cursor:pointer; border:1px solid var(--line); background:var(--panel2);
    color:var(--fg); padding:8px 14px; border-radius:8px; font-size:13px; }
  button:hover:not(:disabled){ border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  input, select, textarea { font-family:var(--sans); background:var(--panel); color:var(--fg);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; width:100%; }
  textarea { font-family:var(--mono); min-height:260px; resize:vertical; line-height:1.5; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line);
    color:var(--muted); }
  .badge { font-size:11px; padding:2px 8px; border-radius:6px; font-weight:600; }
  .badge.ok{ background:rgba(46,204,113,.15); color:var(--ok); }
  .badge.err{ background:rgba(255,92,108,.15); color:var(--err); }
  .badge.warn{ background:rgba(241,196,15,.15); color:var(--warn); }
  /* login */
  #login { display:flex; align-items:center; justify-content:center; height:100vh; }
  #login .card { width:340px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; }
  .brand { font-weight:800; font-size:20px; letter-spacing:.3px; }
  .brand span { color:var(--accent); }
  .muted { color:var(--muted); font-size:12px; }
  /* app */
  #app { display:none; grid-template-columns:220px 1fr; height:100vh; }
  #side { background:var(--panel); border-right:1px solid var(--line); padding:16px; display:flex; flex-direction:column; }
  #side .nav { margin-top:18px; display:flex; flex-direction:column; gap:4px; }
  #side .nav button { text-align:left; background:transparent; border:none; padding:10px 12px; border-radius:8px; color:var(--muted); }
  #side .nav button.active { background:var(--panel2); color:var(--fg); }
  #side .who { margin-top:auto; font-size:12px; color:var(--muted); }
  #main { overflow:auto; padding:22px 26px; }
  h2 { margin:0 0 4px; font-size:18px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .cols { display:grid; grid-template-columns:300px 1fr; gap:20px; }
  .list { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .list .g { padding:8px 12px; background:var(--panel2); font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .list .item { padding:8px 12px; border-top:1px solid var(--line); font-family:var(--mono); font-size:12px; cursor:pointer; }
  .list .item:hover { background:var(--panel2); }
  /* contract version list */
  .ksection { margin-bottom:20px; }
  .khead { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:.6px; color:var(--accent); padding:0 2px 8px; border-bottom:2px solid var(--line); margin-bottom:10px; }
  .khead .kcount { font-weight:600; letter-spacing:0; color:var(--muted); background:var(--panel2);
    border-radius:999px; padding:1px 8px; font-size:11px; }
  .cgroup { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:12px; }
  .cgroup .ghead { padding:8px 12px; background:var(--panel2); font-size:12px; color:var(--fg);
    display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
  .vrow { display:flex; align-items:center; gap:10px; padding:8px 12px; border-top:1px solid var(--line);
    cursor:pointer; font-size:12px; }
  .cgroup .ghead + .vrow { border-top:none; }
  .vrow:hover { background:var(--panel2); }
  .vrow.active { background:color-mix(in srgb, var(--ok) 8%, transparent); }
  .vrow .dot { width:8px; height:8px; border-radius:999px; background:var(--line); flex:none; }
  .vrow .dot.on { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .vrow .vlabel { font-family:var(--mono); color:var(--fg); }
  .vrow .spacer { flex:1; }
  button.mini { padding:3px 10px; font-size:11px; border-radius:6px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .result { margin-top:12px; padding:12px; border-radius:8px; font-family:var(--mono); font-size:12px; white-space:pre-wrap;
    background:var(--panel2); border:1px solid var(--line); max-height:320px; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); font-family:var(--mono); }
  th { color:var(--muted); font-weight:600; }
  .toolbar { display:flex; gap:10px; align-items:center; margin:12px 0; }
  .spacer{ flex:1; }
  .err-text { color:var(--err); }
  .smhead { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .smwrap { display:grid; grid-template-columns:1fr 300px; gap:14px; align-items:start; }
  @media (max-width:820px){ .smwrap { grid-template-columns:1fr; } }
  .smgraph { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px; overflow:auto; }
  .smgraph svg text { font-family:var(--mono); }
  .smnode rect { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
  .smnode.init rect { stroke:var(--accent); }
  .smnode.term rect { stroke:var(--ok); }
  .smnode text { fill:var(--fg); font-size:12px; }
  .smedge { cursor:pointer; }
  .smedge path.wire { fill:none; stroke:var(--muted); stroke-width:1.5; }
  .smedge path.any { stroke-dasharray:4 3; }
  .smedge:hover path.wire, .smedge.sel path.wire { stroke:var(--accent); stroke-width:2.5; }
  .smlabel { cursor:pointer; }
  .smlabel text { fill:var(--fg); font-size:11px; }
  .smlabel .elabel { fill:var(--panel); stroke:var(--line); }
  .smlabel:hover .elabel, .smlabel.sel .elabel { stroke:var(--accent); }
  .smdetail { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:14px; font-size:12px; }
  .smdetail h3 { margin:0 0 4px; font-size:13px; }
  .smdetail .kv { margin:10px 0; }
  .smdetail .kv .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .smdetail .kv .v { font-family:var(--mono); margin-top:2px; word-break:break-word; }
  .smemit { border-left:2px solid var(--accent); padding:2px 0 2px 8px; margin-top:4px; }
  .smlist { margin-top:12px; }
  .smlist .lt { display:flex; gap:10px; padding:6px 8px; border-bottom:1px solid var(--line); cursor:pointer;
    font-family:var(--mono); font-size:12px; border-radius:6px; }
  .smlist .lt:hover, .smlist .lt.sel { background:var(--panel2); }
  .smlist .lt .ev { min-width:130px; color:var(--accent); }
  .trace { margin-top:14px; }
  .trow { display:flex; align-items:center; gap:12px; padding:7px 4px; border-bottom:1px solid var(--line);
    font-family:var(--mono); font-size:12px; }
  .tdot { width:16px; text-align:center; color:var(--muted); }
  .tdot.move { color:var(--ok); } .tdot.del { color:var(--err); }
  .tts { color:var(--muted); width:150px; flex:none; }
  .tver { width:34px; flex:none; color:var(--muted); }
  .tdetail { flex:1; }
  .ttxn { flex:none; }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="brand">Phron<span>e</span>xus</div>
    <div class="muted" style="margin-top:4px">Management Console</div>
    <div id="ssoNote" class="muted" style="margin-top:14px; display:none"></div>
    <button id="ssoBtn" class="primary" style="width:100%; margin-top:16px; display:none"
      onclick="location.href='/auth/oidc/login'">Sign in with Microsoft</button>
    <div id="pwform">
      <label>Username</label><input id="u" autocomplete="username" />
      <label>Password</label><input id="p" type="password" autocomplete="current-password" />
      <div id="loginErr" class="err-text" style="font-size:12px; margin-top:8px"></div>
      <button class="primary" style="width:100%; margin-top:16px" onclick="doLogin()">Sign in</button>
    </div>
  </div>
</div>

<div id="app">
  <div id="side">
    <div class="brand">Phron<span>e</span>xus</div>
    <div class="nav" id="nav"></div>
    <div class="who">
      <div id="whoName"></div>
      <button id="themeBtn" style="margin-top:8px; width:100%" onclick="toggleTheme()">🌙 Dark</button>
      <button style="margin-top:8px; width:100%" onclick="logout()">Sign out</button>
    </div>
  </div>
  <div id="main"></div>
</div>

<script>
const S = { token:null, user:null, roles:[], permissions:[], view:'contracts', contracts:{contracts:[],active:{}}, current:null, pendingDraft:null };
function hasPermission(p){ const P=S.permissions||[];
  return P.includes('*') || P.includes(p) || P.includes(p.split(':')[0]+':*'); }

// ---- theme (light default; persisted) ----
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('phx-theme', t); }catch(e){}
  const b=document.getElementById('themeBtn'); if(b) b.textContent = t==='dark' ? '☀ Light' : '🌙 Dark';
}
function toggleTheme(){ applyTheme((document.documentElement.getAttribute('data-theme')==='dark') ? 'light' : 'dark'); }
(function(){ let t='light'; try{ t=localStorage.getItem('phx-theme')||'light'; }catch(e){} applyTheme(t); })();
const VIEWS = [['contracts','Contracts'],['validate','Document Validator'],['sm','State Machine'],['data','Data Browser'],['trace','Trace'],
  ['changes','Change Requests','governance:read'],['fleet','Fleet','governance:read'],['history','History','governance:read'],
  ['backfill','Backfill','governance:read'],['promotion','Promotion','contract:promote'],['evidence','Evidence','evidence:export'],
  ['lineage','Lineage','governance:read']];
const KINDS = ['storage','query','view','validation','transition','stream'];

const TEMPLATES = {
  storage: {kind:'storage', entity:'myentity', version:1, primary_key:['id'], manifest_set:'myentity_manifest',
    update_policy:'upsert', delete_policy:'soft',
    projections:[{name:'main', set:'myentity_main', key:'{id}', fields:['*'], canonical:true}],
    iceberg:{enabled:false}},
  query: {kind:'query', entity:'myentity', version:1,
    searchable:[{field:'name', index:'string'}],
    patterns:[{name:'by_name', where:[{field:'name', op:'eq', value:'${name}'}]}]},
  view: {kind:'view', entity:'myentity', view:'default', version:1, fields:['id','name'], mask:[], transform:{}},
  validation: {kind:'validation', entity:'myentity', version:1, mode:'enforce',
    json_schema:{type:'object', required:['id'], properties:{id:{type:'string'}}},
    dq_checks:[{name:'id_present', field:'id', required:true, severity:'error'}]},
  transition: {kind:'transition', entity:'myentity', version:1, state_field:'status',
    transitions:[{event:'Created', from:null, to:'active', emit:[{topic:'kafka://myentity.active'}]}]},
  stream: {kind:'stream', entity:'myentity', version:1, mode:'enforce',
    events:[{type:'Created', json_schema:{type:'object', required:['id']}}]},
};

// ---- auth + api ----
async function api(path, opts={}) {
  const h = Object.assign({'content-type':'application/json'}, opts.headers||{});
  if (S.token) h['Authorization'] = 'Bearer '+S.token;
  const r = await fetch(path, Object.assign({}, opts, {headers:h}));
  if (r.status === 401) { logout(); throw new Error('unauthorized'); }
  const text = await r.text();
  let body; try { body = text ? JSON.parse(text) : {}; } catch { body = {raw:text}; }
  if (!r.ok) throw Object.assign(new Error(body.detail||('HTTP '+r.status)), {status:r.status, body});
  return body;
}

async function doLogin() {
  const el = document.getElementById('loginErr'); el.textContent='';
  try {
    const r = await api('/auth/login', {method:'POST', body:JSON.stringify({
      username:document.getElementById('u').value, password:document.getElementById('p').value })});
    S.token=r.token; S.user=r.principal; S.roles=r.roles; S.permissions=r.permissions||[];
    sessionStorage.setItem('phx', JSON.stringify({token:r.token, user:r.principal, roles:r.roles, permissions:S.permissions}));
    showApp();
  } catch(e){ el.textContent = e.body?.detail || 'Sign-in failed'; }
}
function logout(){ S.token=null; sessionStorage.removeItem('phx');
  document.getElementById('app').style.display='none'; document.getElementById('login').style.display='flex'; }

async function showApp() {
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='grid';
  document.getElementById('whoName').innerHTML = '<b>'+S.user+'</b><br><span class="muted">'+(S.roles.join(', ')||'user')+'</span>';
  const nav = document.getElementById('nav'); nav.innerHTML='';
  const visible = VIEWS.filter(([id,label,perm])=>!perm || hasPermission(perm));
  if(!visible.some(([id])=>id===S.view)) S.view = visible[0][0];
  visible.forEach(([id,label])=>{ const b=document.createElement('button'); b.textContent=label;
    b.className = S.view===id?'active':''; b.onclick=()=>{ S.view=id; showApp(); }; nav.appendChild(b); });
  ({contracts:renderContracts, validate:renderValidate, sm:renderSM, data:renderData, trace:renderTrace,
    changes:renderChanges, fleet:renderFleet, history:renderHistory, backfill:renderBackfill,
    promotion:renderPromotion, evidence:renderEvidence, lineage:renderLineage}[S.view])();
}

// ---- Contracts (read-only viewer) ----
// Authoring is single-path: every contract and JSON Schema is created/changed
// through the governed Change Requests flow (draft → submit → approve → publish).
// This screen only *views* published versions and governs the active pointer
// (activate / rollback). It never writes contract bodies.
async function renderContracts() {
  const m = document.getElementById('main');
  const canDraft = hasPermission('contract:draft');
  const draftBtn = canDraft
    ? '<button class="primary" onclick="proposeChange(null)">Propose change (new draft)</button>'
    : '';
  m.innerHTML = `<h2>Contracts</h2><div class="sub">Read-only. Aerospike is the source of truth; ● marks the active version. Contracts and JSON Schemas are authored in one place — <a href="#" onclick="return goView('changes')">Change Requests</a> (draft → approve → publish).</div>
    <div class="toolbar" style="margin-bottom:12px">${draftBtn}</div>
    <div class="cols"><div id="clist"></div><div id="ceditor"></div></div>`;
  try { S.contracts = await api('/contracts'); } catch(e){ S.contracts={contracts:[],active:{}}; }
  document.getElementById('clist').innerHTML = contractListHtml();
  viewerPanel(null);
}
function goView(id){ S.view=id; showApp(); return false; }
// Jump to Change Requests and open a draft, optionally pre-filled from an
// existing contract version ("edit as a new draft").
function proposeChange(doc){ S.pendingDraft = {doc: doc||null}; S.view='changes'; showApp(); }

// "storage:trade:v3" -> {kind, subject:"trade", version:3, group:"storage:trade"}
// "view:trade:default:v1" -> {kind:"view", subject:"trade:default", version:1, ...}
function parseIdentity(id){
  const p = id.split(':');
  const kind = p[0];
  const version = parseInt((p[p.length-1]||'').replace(/^v/,''), 10) || 0;
  const subject = p.slice(1, p.length-1).join(':');
  return { kind, subject, version, group: kind+':'+subject };
}

function contractListHtml(){
  const active = S.contracts.active || {};
  // group[kind][subject] = [{id, version}]
  const byKind = {};
  (S.contracts.contracts||[]).forEach(id=>{
    const info = parseIdentity(id);
    ((byKind[info.kind] = byKind[info.kind] || {})[info.subject] =
      byKind[info.kind][info.subject] || []).push({ id, version: info.version });
  });
  if(!Object.keys(byKind).length) return '<div class="muted">No contracts yet.</div>';
  // known kinds first (KINDS order), then any others alphabetically
  const kinds = KINDS.filter(k=>byKind[k]).concat(
    Object.keys(byKind).filter(k=>!KINDS.includes(k)).sort());
  let html='';
  kinds.forEach(kind=>{
    const subjects = Object.keys(byKind[kind]).sort();
    html += '<div class="ksection"><div class="khead">'+kind
          + '<span class="kcount">'+subjects.length+'</span></div>';
    subjects.forEach(subject=>{
      const versions = byKind[kind][subject].sort((a,b)=> b.version - a.version); // newest first
      const activeId = active['active:'+kind+':'+subject];
      html += '<div class="cgroup"><div class="ghead"><b>'+escapeHtml(subject)+'</b>'
            + (versions.length>1 ? '<span class="pill">'+versions.length+' versions</span>' : '')
            + '</div>';
      versions.forEach(v=>{
        const on = v.id===activeId;
        html += '<div class="vrow'+(on?' active':'')+'" onclick="loadContract(\''+v.id+'\')">'
              + '<span class="dot'+(on?' on':'')+'"></span>'
              + '<span class="vlabel">v'+v.version+'</span><span class="spacer"></span>'
              + (on ? '<span class="badge ok">ACTIVE</span>'
                    : '<button class="mini" onclick="event.stopPropagation();activateContract(\''+v.id+'\')">Activate</button>')
              + '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
  });
  return html;
}

async function activateContract(id){
  // Prefer the governed, audited rollback path when permitted; fall back to the
  // direct admin activate.
  if(hasPermission('contract:rollback')){
    const reason = prompt('Roll the active pointer to '+id+'? Enter a reason (recorded in the governance log):');
    if(reason===null) return;
    try { await api('/governance/rollback', {method:'POST', body:JSON.stringify({identity:id, reason})});
          renderContracts(); }
    catch(e){ alert('Rollback failed: '+(e.body?.detail||e.message)); }
    return;
  }
  if(!confirm('Make '+id+' the active version? New writes and pointer-less reads will use it.')) return;
  try { await api('/contracts/'+encodeURIComponent(id)+'/activate', {method:'POST'});
        renderContracts(); }
  catch(e){ alert('Activate failed: '+(e.body?.detail||e.message)); }
}

// Read-only viewer. No inline editing/publishing — the only way to change a
// contract is to propose a governed draft (which opens the Change Requests flow
// pre-filled from this version).
function viewerPanel(doc, id) {
  S.viewing = doc || null;   // read back by proposeChange (avoids inlining JSON in attributes)
  const canDraft = hasPermission('contract:draft');
  const propose = (doc && canDraft)
    ? `<button class="primary" onclick="proposeChange(S.viewing)">Propose change from this version</button>`
    : '';
  const bodyHtml = doc
    ? `<div class="smhead"><b>${escapeHtml(id||'')}</b></div>
       <label>Contract (read-only)</label>
       <div class="result">${escapeHtml(JSON.stringify(doc,null,2))}</div>
       <div class="toolbar">${propose || '<span class="muted">viewing only</span>'}</div>`
    : `<div class="muted">Select a version to view it. To create or change a contract or JSON Schema, use ${canDraft?'“Propose change”':'the Change Requests flow'} — every change is drafted, approved, and published through one governed path.</div>`;
  document.getElementById('ceditor').innerHTML = `<div class="card">${bodyHtml}</div>`;
}
async function loadContract(id){ try{ const doc=await api('/contracts/'+encodeURIComponent(id)); viewerPanel(doc, id);}catch(e){} }

// ---- Document validator ----
function renderValidate(){
  document.getElementById('main').innerHTML = `<h2>Document Validator</h2>
    <div class="sub">Run JSON Schema + data-quality checks against an entity's validation contract.</div>
    <div class="card" style="max-width:820px">
      <label>Entity</label><input id="vent" placeholder="e.g. bond" />
      <label>Document (JSON)</label><textarea id="vdoc">{
}</textarea>
      <div class="toolbar"><button class="primary" onclick="validateDoc()">Validate</button></div>
      <div id="vresult"></div></div>`;
}
async function validateDoc(){
  const out=document.getElementById('vresult'); let doc;
  try{ doc=JSON.parse(document.getElementById('vdoc').value);}catch(e){ out.innerHTML=res(false,['Invalid JSON: '+e.message]); return; }
  try{ const r=await api('/entities/'+encodeURIComponent(document.getElementById('vent').value)+'/validate',
        {method:'POST', body:JSON.stringify({document:doc})});
    let lines=[]; if(r.ok) lines.push('OK'); (r.errors||[]).forEach(e=>lines.push('✗ '+e)); (r.warnings||[]).forEach(w=>lines.push('⚠ '+w));
    out.innerHTML = res(r.ok, lines);
  }catch(e){ out.innerHTML=res(false,[e.body?.detail||e.message]); }
}

// ---- State machine ----
async function renderSM(){
  const m=document.getElementById('main');
  m.innerHTML = `<h2>State Machine</h2><div class="sub">Inspect lifecycles and submit events (synchronous accept/reject).</div>
    <label style="max-width:320px">Transition contract</label>
    <div class="row" style="max-width:320px"><select id="tc" onchange="loadTransitions()"></select></div>
    <div id="tcview" style="margin-top:16px"></div>
    <div class="card" style="margin-top:18px; max-width:820px"><h2 style="font-size:15px">Event console</h2>
      <div class="row"><div><label>Entity</label><input id="eent"/></div>
        <div><label>Event type</label><input id="etype"/></div></div>
      <div class="row"><div><label>Key (doc id)</label><input id="ekey"/></div>
        <div><label>Event id</label><input id="eid"/></div></div>
      <label>Payload (JSON)</label><textarea id="epayload" style="min-height:140px">{
}</textarea>
      <div class="toolbar"><button class="primary" onclick="submitEvent()">Submit event</button></div>
      <div id="eresult"></div></div>`;
  try{ if(!S.contracts.contracts) S.contracts=await api('/contracts'); }catch(e){}
  const tcs=(S.contracts.contracts||[]).filter(id=>id.startsWith('transition:'));

async function loadTransitions(){
  const id=document.getElementById('tc').value; const v=document.getElementById('tcview'); if(!id){ v.innerHTML=''; return; }
  const c=await api('/contracts/'+encodeURIComponent(id));
  document.getElementById('eent').value=c.entity;

  const inputs=(c.inputs||[]).map(i=>'<span class="pill">in: '+escapeHtml(i)+'</span>').join(' ');
  v.innerHTML = `<div class="card">

    <div class="smwrap">
      <div id="smgraph" class="smgraph"></div>
      <div id="smdetail" class="smdetail"><div class="muted">Click a transition — an arrow or a row below — to see its input event, guard, and what it emits.</div></div>
    </div>
    <div id="smlist" class="smlist"></div></div>`;
  drawSM(c);
  // transitions list (accessible + clickable mirror of the graph edges)
  document.getElementById('smlist').innerHTML = (c.transitions||[]).map((t,i)=>
    `<div class="lt" id="lt${i}" onclick="selTrans(${i})"><span class="ev">${escapeHtml(t.event)}</span>`
    +`<span>${t.from===null?'▶ (start)':(t.from==='*'?'∗ any':escapeHtml(t.from))} → ${escapeHtml(t.to)}</span>`
    +`<span class="muted">${t.guard?('guard: '+escapeHtml(t.guard)):''}</span></div>`).join('');
}
function drawSM(c){
  const T=c.transitions||[]; const seen={}, states=[];
  const add=s=>{ if(s!==null&&s!=='*'&&!(s in seen)){ seen[s]=1; states.push(s); } };
  T.forEach(t=>{ add(t.from); add(t.to); });
  // Rank each state by longest path from an initial state (concrete edges only).
  const rank={}; states.forEach(s=>rank[s]=0);
  for(let it=0; it<states.length+1; it++) T.forEach(t=>{
    if(t.from===null||t.from==='*') return;
    if(rank[t.to] < rank[t.from]+1) rank[t.to]=rank[t.from]+1;
  });
  const cols={}; states.forEach(s=>(cols[rank[s]]=cols[rank[s]]||[]).push(s));
  const maxR=Math.max(0,...states.map(s=>rank[s]));
  const froms=new Set(T.filter(t=>t.from&&t.from!=='*').map(t=>t.from));
  const inits=new Set(T.filter(t=>t.from===null).map(t=>t.to));
  const NW=150,NH=42,CG=104,RG=24,PADX=54,PADY=24;
  let rows=0; for(let r=0;r<=maxR;r++) rows=Math.max(rows,(cols[r]||[]).length);
  const W=PADX+(maxR+1)*NW+maxR*CG+30, H=PADY*2+rows*NH+(rows-1)*RG;
  const pos={};
  for(let r=0;r<=maxR;r++){ const col=cols[r]||[]; const colH=col.length*NH+(col.length-1)*RG;
    col.forEach((s,i)=>{ pos[s]={x:PADX+r*(NW+CG), y:PADY+(H-PADY*2-colH)/2+i*(NH+RG), w:NW, h:NH}; }); }
  const edges=[];
  T.forEach((t,i)=>{
    const tgt=pos[t.to]; if(!tgt) return;
    let sx,sy; const tx=tgt.x, ty=tgt.y+tgt.h/2; let cls='';
    if(t.from===null){ sx=tgt.x-30; sy=ty; cls=''; }        // start marker
    else if(t.from==='*'){ sx=tgt.x-30; sy=tgt.y-14; cls='any'; }
    else { const s=pos[t.from]; if(!s) return; sx=s.x+s.w; sy=s.y+s.h/2; }
    const back=tx<sx; const dx=Math.max(34,Math.abs(tx-sx)/2);
    const off=(i%2?1:-1)*(6+8*(i%3));
    const mx=(sx+tx)/2, my=(sy+ty)/2 - 16 - (back?18:0) + (t.from==='*'?0:off*0.4);
    const d=`M ${sx} ${sy} C ${sx+dx} ${sy+(back?off:0)}, ${tx-dx} ${ty+(back?off:0)}, ${tx} ${ty}`;
    edges.push({i,t,d,mx,my,cls,start:t.from===null});
  });
  const node=s=>{ const p=pos[s]; const cl='smnode'+(inits.has(s)?' init':'')+(!froms.has(s)?' term':'');
    return `<g class="${cl}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="9"/>`
      +`<text x="${p.x+p.w/2}" y="${p.y+p.h/2+4}" text-anchor="middle">${escapeHtml(s)}</text></g>`; };
  // Wires render behind the nodes; labels render in a separate pass AFTER the
  // nodes so an event label is never hidden by a state box.
  const wire=e=>`<g class="smedge" id="ed${e.i}" onclick="selTrans(${e.i})">`
      +`<path class="wire ${e.cls}" d="${e.d}" marker-end="url(#arw)"/></g>`;
  const label=e=>{ const lw=Math.max(30,(e.t.event.length)*6.6+10);
    return `<g class="smlabel" id="el${e.i}" onclick="selTrans(${e.i})">`
      +`<rect class="elabel" x="${e.mx-lw/2}" y="${e.my-11}" width="${lw}" height="17" rx="5"/>`
      +`<text x="${e.mx}" y="${e.my+1}" text-anchor="middle">${escapeHtml(e.t.event)}</text></g>`; };
  // start dots for initial transitions
  const dots=edges.filter(e=>e.start).map(e=>{ const p=pos[e.t.to];
    return `<circle cx="${p.x-30}" cy="${p.y+p.h/2}" r="5" fill="var(--accent)"/>`; }).join('');
  document.getElementById('smgraph').innerHTML =
    `<svg width="${W}" height="${Math.max(H,80)}" viewBox="0 0 ${W} ${Math.max(H,80)}">`
    +`<defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">`
    +`<path d="M0,0 L7.5,3 L0,6 Z" fill="var(--muted)"/></marker></defs>`
    +dots + edges.map(wire).join('') + states.map(node).join('') + edges.map(label).join('') + `</svg>`;
}
function selTrans(i){
  const c=S.tc; if(!c) return; const t=c.transitions[i]; S.tcSel=i;
  document.querySelectorAll('.smedge.sel,.smlabel.sel,.smlist .lt.sel').forEach(el=>el.classList.remove('sel'));
  const ed=document.getElementById('ed'+i); if(ed) ed.classList.add('sel');
  const el=document.getElementById('el'+i); if(el) el.classList.add('sel');
  const lt=document.getElementById('lt'+i); if(lt) lt.classList.add('sel');
  const emits=(t.emit||[]).map(e=>`<div class="smemit"><b>${escapeHtml(e.type||t.to)}</b><br><span class="muted">${escapeHtml(e.topic)}</span></div>`).join('') || '<span class="muted">— nothing emitted —</span>';
  const src = t.from===null?'▶ start':(t.from==='*'?'any state':t.from);
  document.getElementById('smdetail').innerHTML =
    `<h3>${escapeHtml(t.event)}</h3><div class="muted">arrives on ${(c.inputs||['—']).map(escapeHtml).join(', ')}</div>`
    +`<div class="kv"><div class="k">transition</div><div class="v">${escapeHtml(String(src))} → ${escapeHtml(t.to)}</div></div>`
    +`<div class="kv"><div class="k">guard</div><div class="v">${t.guard?escapeHtml(t.guard):'—'}</div></div>`
    +`<div class="kv"><div class="k">in between (atomic commit)</div><div class="v muted">writes ${escapeHtml(c.state_field||'status')}=<b>${escapeHtml(t.to)}</b> + enqueues the outputs below in one transaction; dedup marker makes redelivery a no-op.</div></div>`
    +`<div class="kv"><div class="k">emits →</div><div class="v">${emits}</div></div>`;
  // prefill the event console for a quick try
  document.getElementById('etype').value=t.event;
}
async function submitEvent(){

      j.reason?('reason: '+j.reason):null, (j.emitted&&j.emitted.length)?('emitted: '+j.emitted.join(', ')):null].filter(Boolean));
  }catch(e){ out.innerHTML=res(false,[e.message]); }
}

function renderTrace(){
  document.getElementById('main').innerHTML = `<h2>Trace</h2>
    <div class="sub">What happened to one document — every commit, delete and state transition, oldest first. Built off the change feed by the decoupled audit worker.</div>
    <div class="card" style="max-width:900px">
      <div class="row"><div><label>Entity</label><input id="tent" placeholder="e.g. bond"/></div>
        <div><label>Doc id</label><input id="tid" placeholder="e.g. US0378331005"/></div></div>
      <div class="toolbar"><button class="primary" onclick="loadTrace()">Trace</button></div>
      <div id="tresult"></div></div>`;
}
function fmtTs(ts){ try{ return new Date(ts*1000).toISOString().replace('T',' ').slice(0,19); }catch(e){ return ''+ts; } }
async function loadTrace(){
  const out=document.getElementById('tresult');
  const ent=document.getElementById('tent').value, id=document.getElementById('tid').value;
  if(!ent||!id){ out.innerHTML=res(false,['Enter an entity and doc id']); return; }
  try{
    const r=await api('/entities/'+encodeURIComponent(ent)+'/documents/'+encodeURIComponent(id)+'/trace');
    const ev=r.events||[];
    if(!ev.length){ out.innerHTML='<div class="muted" style="margin-top:12px">No trace yet — nothing recorded for '+escapeHtml(ent+'/'+id)+'. (With Kafka, the audit worker lands records a moment after each write.)</div>'; return; }
    let rows=ev.map(e=>{
      const isDel=e.kind==='delete';
      const moved=(e.from!==undefined||e.to!==undefined)&&e.to!==e.from;
      const dot=isDel?'●':(moved?'◆':'○');
      const detail = isDel ? 'deleted'
        : moved ? ('transition  '+String(e.from)+' → '+e.to)
        : ('commit'+(e.state!==undefined?('  state='+e.state):''));
      return '<div class="trow"><span class="tdot '+(isDel?'del':(moved?'move':''))+'">'+dot+'</span>'
        +'<span class="tts">'+fmtTs(e.ts)+'</span>'
        +'<span class="tver">v'+(e.version||'?')+'</span>'
        +'<span class="tdetail">'+escapeHtml(detail)+'</span>'
        +'<span class="ttxn muted">'+escapeHtml((e.txn_id||'').slice(0,8))+'</span></div>';
    }).join('');
    out.innerHTML='<div class="trace">'+rows+'</div>';
  }catch(e){ out.innerHTML=res(false,[e.body?.detail||e.message]); }
}

async function showChange(id){
  let c; try{ c=await api('/governance/changes/'+id); }catch(e){ return; }
  const appr = c.approvals||[];
  const req = c.required_approvals==null?'—':c.required_approvals;
  let compat = '';
  if(c.compat){
    const ok=c.compat.compatible;
    compat = `<div class="${ok?'badge ok':'badge err'}">${ok?'compatible':'BREAKING'}</div>`;
    if((c.compat.changes||[]).length)
      compat += '<div class="result">'+c.compat.changes.map(x=>(x.breaking?'⚠ ':'· ')+x.field+': '+JSON.stringify(x.from)+' → '+JSON.stringify(x.to)).map(escapeHtml).join('\n')+'</div>';
  }

  document.getElementById('chdetail').innerHTML = `<div class="card">
    <div class="smhead"><span class="pill">${escapeHtml(c.contract_kind)}</span> <b>${escapeHtml(c.identity)}</b> <span class="${CH_BADGE[c.status]||'pill'}">${escapeHtml(c.status)}</span></div>

      <div class="kv"><span class="k">Author</span><span class="v">${escapeHtml(c.author)}</span></div>
      <div class="kv"><span class="k">Approvals</span><span class="v">${appr.map(a=>escapeHtml(a.approver)).join(', ')||'—'} (${appr.length} / ${req})</span></div>${prov}</div>

    <div id="chresult"></div></div>`;
}

async function renderPromotion(){
  document.getElementById('main').innerHTML=`<h2>Promotion</h2>
    <div class="sub">Export a signed, provenance-stamped bundle to promote a version, or import one from a lower environment.</div>
    <div class="cols">
      <div class="card"><h3>Export</h3><label>Contract identity</label><input id="promId" placeholder="storage:trade:v1">
        <div class="toolbar"><button class="primary" onclick="promExport()">Export &amp; download</button></div><div id="promOut"></div></div>
      <div class="card"><h3>Import</h3><label>Bundle JSON ({bundle, signature})</label><textarea id="promImp"></textarea>
        <div class="toolbar"><button class="primary" onclick="promImport()">Import</button></div><div id="promImpOut"></div></div>
    </div>`;
}
async function promExport(){
  const id=document.getElementById('promId').value.trim();
  try{ const b=await api('/governance/promote/'+encodeURIComponent(id)+'/bundle',{method:'POST'});
    _download(id.replace(/:/g,'_')+'.bundle.json', b);
    document.getElementById('promOut').innerHTML=res(true,['Exported '+id+' — content hash '+b.bundle.content_hash.slice(0,16)+'…']);
  }catch(e){ document.getElementById('promOut').innerHTML=res(false,[e.body?.detail||e.message]); }
}
async function promImport(){
  let payload; try{ payload=JSON.parse(document.getElementById('promImp').value); }catch(e){ document.getElementById('promImpOut').innerHTML=res(false,['Invalid JSON']); return; }
  try{ const c=await api('/governance/import',{method:'POST',body:JSON.stringify(payload)});
    document.getElementById('promImpOut').innerHTML=res(true,['Imported as change '+c.id+' ('+c.status+') in '+c.environment]);
  }catch(e){ document.getElementById('promImpOut').innerHTML=res(false,[e.body?.detail||e.message]); }
}

// ---- Governance: Evidence ----
async function renderEvidence(){
  document.getElementById('main').innerHTML=`<h2>Audit Evidence</h2>
    <div class="sub">Export a tamper-evident evidence bundle (audit trail + interactions + governance log).</div>
    <div class="card"><div class="row"><div><label>Entity (optional)</label><input id="evEntity" placeholder="trade"></div>
      <div><label>Document id (optional)</label><input id="evDoc"></div></div>
      <div class="toolbar"><button class="primary" onclick="evExport()">Export &amp; download</button></div><div id="evOut"></div></div>`;
}
async function evExport(){
  const body={entity:document.getElementById('evEntity').value||null, doc_id:document.getElementById('evDoc').value||null};
  try{ const b=await api('/governance/evidence',{method:'POST',body:JSON.stringify(body)});
    _download('evidence_'+(body.entity||'all')+'.json', b);
    document.getElementById('evOut').innerHTML=res(true,['Exported — counts '+JSON.stringify(b.manifest.counts)+' · hash '+b.manifest.content_hash.slice(0,16)+'…']);
  }catch(e){ document.getElementById('evOut').innerHTML=res(false,[e.body?.detail||e.message]); }
}
function _download(name, obj){ const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

// ---- CCR: Lineage ----
async function renderLineage(){
  document.getElementById('main').innerHTML=`<h2>Lineage</h2>
    <div class="sub">Source event → saga → cube inputs → exposure result, for one trade.</div>
    <div class="card"><div class="row"><div><label>Entity</label><input id="lnEntity" value="ccr_trade"></div>
      <div><label>Trade id</label><input id="lnId" placeholder="CCR-T-1"></div></div>
      <div class="toolbar"><button class="primary" onclick="lnGo()">Trace lineage</button></div></div>
    <div id="lnOut"></div>`;
}
async function lnGo(){
  const e=document.getElementById('lnEntity').value||'ccr_trade';
  const id=document.getElementById('lnId').value.trim();
  const out=document.getElementById('lnOut');
  try{
    const l=await api('/entities/'+encodeURIComponent(e)+'/documents/'+encodeURIComponent(id)+'/lineage');
    const saga=(l.saga||[]).map(s=>`<div class="trow"><span class="tdot"></span><span class="tver">${escapeHtml(String(s.state||s.kind||s.op||''))}</span> <span class="muted">${escapeHtml(String(s.txn_id||s.txn||''))}</span><div class="ttxn">${new Date((s.ts||0)*1000).toLocaleString()}</div></div>`).join('');
    const inter=(l.interactions||[]).map(i=>`<tr><td>${escapeHtml(String(i.type||''))}</td><td><span class="pill">${escapeHtml(String(i.status||''))}</span></td><td>${escapeHtml(String(i.event_id||''))}</td></tr>`).join('');
    const exp=l.exposure_result?`${l.exposure_result.exposure} ${escapeHtml(String(l.exposure_result.currency||''))}`:'—';
    const ns=l.ns_exposure?`${l.ns_exposure.exposure}`:'—';
    out.innerHTML=`<div class="cols">
      <div class="card"><h3>Source → result</h3><div class="smdetail">
        <div class="kv"><span class="k">Trade</span><span class="v">${escapeHtml(l.trade_id)} <span class="badge ok">${escapeHtml(String(l.source&&l.source.trade&&l.source.trade.status||'?'))}</span></span></div>
        <div class="kv"><span class="k">Netting set</span><span class="v">${escapeHtml(String(l.source&&l.source.netting_set_id||'—'))}</span></div>
        <div class="kv"><span class="k">As-of COB</span><span class="v">${l.as_of==null?'—':l.as_of}</span></div>
        <div class="kv"><span class="k">Cube inputs</span><span class="v">${(l.cube&&l.cube.point_count)||0} points ${escapeHtml(((l.cube&&l.cube.scenarios)||[]).join(', '))}</span></div>
        <div class="kv"><span class="k">Exposure</span><span class="v">${exp}</span></div>
        <div class="kv"><span class="k">Netting exposure</span><span class="v">${ns}</span></div></div>
        <label>Producing contract versions</label><div class="result">${escapeHtml(JSON.stringify(l.contract_versions||{}))}</div></div>
      <div class="card"><h3>Saga timeline</h3><div class="trace">${saga||'<div class="muted">no audit yet</div>'}</div>
        <h3>Interactions</h3><table><tr><th>Type</th><th>Status</th><th>Event id</th></tr>${inter||'<tr><td colspan="3" class="muted">none (enable request journaling)</td></tr>'}</table></div>
    </div>`;
  }catch(err){ out.innerHTML=res(false,[err.body?.detail||err.message]); }
}

// ---- helpers ----
function res(ok, lines){ const b='<span class="badge '+(ok?'ok':'err')+'">'+(ok?'OK':'FAILED')+'</span>';
  return '<div class="result">'+b+'\n'+lines.map(escapeHtml).join('\n')+'</div>'; }
function escapeHtml(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- boot ----
(async function(){
  // OIDC callback hands us a session token in the URL fragment.
  if(location.hash.startsWith('#token=')){
    S.token = decodeURIComponent(location.hash.slice('#token='.length));
    history.replaceState(null,'','/ui/');
    try{ const me=await api('/auth/me'); S.user=me.principal; S.roles=me.roles; S.permissions=me.permissions||[];
      sessionStorage.setItem('phx', JSON.stringify({token:S.token,user:S.user,roles:S.roles,permissions:S.permissions}));
      showApp(); return; }catch(e){}
  }
  try { const cfg=await (await fetch('/auth/config')).json();
    if(cfg.provider==='oidc' || cfg.oidc_enabled){
      document.getElementById('pwform').style.display='none';
      document.getElementById('ssoBtn').style.display='block';
      const n=document.getElementById('ssoNote'); n.style.display='block';
      n.textContent='Sign in with your organization account (Microsoft Entra).'; } } catch(e){}
  const saved=sessionStorage.getItem('phx');
  if(saved){ const s=JSON.parse(saved); S.token=s.token; S.user=s.user; S.roles=s.roles; S.permissions=s.permissions||[];
    try{ const me=await api('/auth/me'); S.permissions=me.permissions||S.permissions; showApp(); return; }catch(e){} }
  document.getElementById('login').style.display='flex';
})();
</script>
