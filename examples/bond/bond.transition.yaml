kind: transition
entity: bond
version: 1
state_field: status
inputs: ["kafka://bonds.events"]
transitions:
  - event: BondIssued
    from: null
    to: active
    emit:
      # Shape the outbound message from specific fields (drops coupon/currency/etc.);
      # uppercase the issuer. The shaped payload is validated against bond.stream.yaml.
      - {topic: "kafka://bonds.active", type: BondActivated,
         fields: [isin, issuer, status], transform: {issuer: upper}}
  - event: BondCalled
    from: active
    to: called
    guard: "callable == True"
    emit:
      - {topic: "kafka://bonds.called", type: BondCalled}
  - event: BondMatured
    from: active
    to: matured
    emit:
      - {topic: "kafka://bonds.matured", type: BondMatured}
