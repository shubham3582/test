kind: query
entity: ccr_trade
version: 1
searchable:
  - {field: counterparty, index: string, name: idx_cp}
  - {field: netting_set_id, index: string, name: idx_ns}
  - {field: book, index: string}
  - {field: status, index: string}
  - {field: notional, index: numeric}
patterns:
  - name: by_counterparty
    where:
      - {field: counterparty, op: eq, value: "${counterparty}"}
  - name: by_netting_set
    where:
      - {field: netting_set_id, op: eq, value: "${netting_set_id}"}
  - name: pending_by_counterparty
    where:
      - {field: counterparty, op: eq, value: "${counterparty}"}
      - {field: status, op: ne, value: published}
