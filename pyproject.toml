[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phronexus-core"
version = "0.1.0"
description = "Contract-driven data projection framework over Aerospike with optional Iceberg retention"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Phronexus" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "jsonschema>=4.20",
    "msgpack>=1.0",
]

[project.scripts]
phronexus = "phronexus.cli:main"

[project.optional-dependencies]
# Backends and integrations are optional so the core + in-memory backend
# stay importable with a minimal dependency footprint.
aerospike = ["aerospike>=19.0"]                       # latest client (server 7.x/8.x)
kafka = ["confluent-kafka>=2.3"]
# AWS-managed Kafka (MSK) with IAM auth.
msk = ["confluent-kafka>=2.3", "aws-msk-iam-sasl-signer-python>=1.0"]
# Iceberg retention. `iceberg` covers a REST/Glue catalog; `s3tables` adds the
# AWS deps for Amazon S3 Tables (its Iceberg REST endpoint + S3 data files).
iceberg = ["pyiceberg>=0.9", "pyarrow>=15.0"]
s3tables = ["pyiceberg>=0.9", "pyarrow>=15.0", "boto3>=1.34"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
client = ["httpx>=0.27"]
oidc = ["pyjwt[crypto]>=2.8", "httpx>=0.27"]
otel = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "fastapi>=0.110",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "freezegun>=1.5",
]

[tool.setuptools.packages.find]
include = ["phronexus*"]

[tool.setuptools.package-data]
"phronexus.api.ui" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "chaos: deterministic fault-injection / crash-consistency tests (Stage-1 guarantees)",
    "governance: control-plane governance tests (Stage-2 guarantees)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
