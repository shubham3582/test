# Apache Iceberg — optional async long-term retention store.
# Maps to phronexus.config.IcebergSettings.

enabled: true
backend: iceberg                 # memory | iceberg
catalog_name: phronexus
catalog_uri: "${ICEBERG_CATALOG_URI:-https://iceberg-rest:8181}"
warehouse: "${ICEBERG_WAREHOUSE:-s3://phronexus/warehouse}"
batch_size: 500

# --- REST catalog auth / TLS ---
catalog_token: "${ICEBERG_CATALOG_TOKEN:-}"     # bearer token for the REST catalog
catalog_tls_cafile: "${ICEBERG_TLS_CAFILE:-/etc/phronexus/certs/iceberg-ca.pem}"
catalog_tls_certfile: "${ICEBERG_TLS_CERTFILE:-/etc/phronexus/certs/iceberg-client.pem}"  # mTLS
catalog_tls_keyfile: "${ICEBERG_TLS_KEYFILE:-/etc/phronexus/certs/iceberg-client.key}"    # mTLS

# --- object store (S3-compatible) ---
s3_endpoint: "${S3_ENDPOINT:-https://minio:9000}"
s3_region: "${S3_REGION:-us-east-1}"
s3_access_key_id: "${S3_ACCESS_KEY_ID:-}"
s3_secret_access_key: "${S3_SECRET_ACCESS_KEY:-}"
s3_tls_verify: true
