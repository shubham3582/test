# Self-contained local stack: Aerospike + Kafka (Redpanda) + Phronexus.
#   cd deploy && ./setup.sh        # build, start, ingest, smoke-test
#   docker compose down -v         # tear down
#
# Apple Silicon: images below are multi-arch. If an image lacks an arm64 build,
# add `platform: linux/amd64` to that service (Docker Desktop emulates it).
services:
  aerospike:
    image: aerospike/aerospike-server:latest      # Community Edition (latest)
    container_name: phx-aerospike
    ports: ["3000:3000"]
    volumes:
      # The image's entrypoint renders a template -> /etc/aerospike/aerospike.conf
      # on startup, so mount our config as the TEMPLATE (it has no ${...}
      # placeholders, so envsubst passes it through unchanged).
      - ./aerospike.conf:/etc/aerospike/aerospike.template.conf:ro
    healthcheck:
      # CE has no auth; a TCP connect to the service port means it's accepting clients.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/3000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  redpanda:
    image: redpandadata/redpanda:v24.1.7          # Kafka-API compatible
    container_name: phx-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports: ["9092:9092", "9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  phronexus-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: phx-api
    depends_on:
      aerospike: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    ports: ["8080:8080"]
    environment:
      PHRONEXUS_BACKEND: aerospike
      PHRONEXUS_AEROSPIKE__HOSTS: aerospike:3000
      PHRONEXUS_AEROSPIKE__NAMESPACE: phronexus
      # Community Edition has no multi-record transactions — use the manifest
      # pattern without native txns (visibility still all-or-nothing).
      PHRONEXUS_AEROSPIKE__USE_NATIVE_TXN: "false"
      PHRONEXUS_KAFKA__ENABLED: "true"
      PHRONEXUS_KAFKA__BOOTSTRAP_SERVERS: redpanda:9092
      PHRONEXUS_KAFKA__SECURITY_PROTOCOL: PLAINTEXT
      # Fast contract-cache refresh so ingested contracts show up quickly.
      PHRONEXUS_CONTRACTS__REFRESH_SECONDS: "5"
      PHRONEXUS_OBSERVABILITY__LOG_LEVEL: INFO
      # Management UI + API auth (JWT login). CHANGE these for anything real.
      PHRONEXUS_API__AUTH__SCHEMES: '["jwt"]'
      PHRONEXUS_API__AUTH__JWT_SECRET: local-dev-change-me
      PHRONEXUS_API__AUTH__USERS: '{"admin":{"password":"admin","roles":["admin"]}}'
      PHRONEXUS_STATEMACHINE__DLQ_TOPIC: kafka://phronexus.dlq
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  # Optional: the autonomous Kafka state-machine runner.
  #   docker compose --profile workers up -d
  phronexus-runner:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: phx-runner
    profiles: ["workers"]
    depends_on:
      phronexus-api: {condition: service_healthy}
    environment:
      PHRONEXUS_BACKEND: aerospike
      PHRONEXUS_AEROSPIKE__HOSTS: aerospike:3000
      PHRONEXUS_AEROSPIKE__USE_NATIVE_TXN: "false"
      PHRONEXUS_KAFKA__ENABLED: "true"
      PHRONEXUS_KAFKA__BOOTSTRAP_SERVERS: redpanda:9092
      PHRONEXUS_KAFKA__SECURITY_PROTOCOL: PLAINTEXT
      PHRONEXUS_STATEMACHINE__INPUT_TOPICS: '["trades.events", "bonds.events"]'
      PHRONEXUS_STATEMACHINE__DLQ_TOPIC: kafka://phronexus.dlq
    command: ["python", "-m", "phronexus.statemachine.runner"]

  # Optional: the distributed scheduler. Run more than one replica for
  # availability — the Aerospike CAS lease fires each occurrence exactly once.
  #   docker compose --profile workers up -d --scale phronexus-scheduler=2
  phronexus-scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: ["workers"]
    depends_on:
      phronexus-api: {condition: service_healthy}
    environment:
      PHRONEXUS_BACKEND: aerospike
      PHRONEXUS_AEROSPIKE__HOSTS: aerospike:3000
      PHRONEXUS_AEROSPIKE__USE_NATIVE_TXN: "false"
      PHRONEXUS_KAFKA__ENABLED: "true"
      PHRONEXUS_KAFKA__BOOTSTRAP_SERVERS: redpanda:9092
      PHRONEXUS_KAFKA__SECURITY_PROTOCOL: PLAINTEXT
      PHRONEXUS_SCHEDULER__POLL_SECONDS: "5"
    command: ["python", "-m", "phronexus.scheduler.runner"]

  # --- Iceberg retention lake (profile: iceberg) --------------------------
  # MinIO (S3-compatible object store) + an Iceberg REST catalog + the
  # retention worker. Validates the async retention path end to end:
  #   API write -> Kafka change feed -> retention worker -> Iceberg table on S3.
  #   docker compose --profile iceberg up -d
  #   python validate_iceberg.py         # scans the landed rows
  minio:
    image: minio/minio:latest
    container_name: phx-minio
    profiles: ["iceberg"]
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]     # S3 API / web console
    environment:
      MINIO_ROOT_USER: phronexus
      MINIO_ROOT_PASSWORD: phronexus-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  # One-shot: create the warehouse bucket, then exit.
  minio-init:
    image: minio/mc:latest
    container_name: phx-minio-init
    profiles: ["iceberg"]
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 phronexus phronexus-secret &&
      mc mb --ignore-existing local/warehouse &&
      echo 'bucket warehouse ready'
      "

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: phx-iceberg-rest
    profiles: ["iceberg"]
    depends_on:
      minio-init: {condition: service_completed_successfully}
    ports: ["8181:8181"]
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: phronexus
      AWS_SECRET_ACCESS_KEY: phronexus-secret
      AWS_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8181/v1/config || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  phronexus-retention:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: phx-retention
    profiles: ["iceberg"]
    depends_on:
      phronexus-api: {condition: service_healthy}
      iceberg-rest: {condition: service_healthy}
    environment:
      PHRONEXUS_BACKEND: aerospike
      PHRONEXUS_AEROSPIKE__HOSTS: aerospike:3000
      PHRONEXUS_AEROSPIKE__USE_NATIVE_TXN: "false"
      PHRONEXUS_KAFKA__ENABLED: "true"
      PHRONEXUS_KAFKA__BOOTSTRAP_SERVERS: redpanda:9092
      PHRONEXUS_KAFKA__SECURITY_PROTOCOL: PLAINTEXT
      PHRONEXUS_CONTRACTS__REFRESH_SECONDS: "5"
      # Write to real Iceberg tables via the REST catalog on top of MinIO.
      PHRONEXUS_ICEBERG__BACKEND: iceberg
      PHRONEXUS_ICEBERG__CATALOG_URI: http://iceberg-rest:8181
      PHRONEXUS_ICEBERG__WAREHOUSE: s3://warehouse/
      PHRONEXUS_ICEBERG__S3_ENDPOINT: http://minio:9000
      PHRONEXUS_ICEBERG__S3_REGION: us-east-1
      PHRONEXUS_ICEBERG__S3_ACCESS_KEY_ID: phronexus
      PHRONEXUS_ICEBERG__S3_SECRET_ACCESS_KEY: phronexus-secret
      PHRONEXUS_OBSERVABILITY__LOG_LEVEL: INFO
    command: ["python", "-m", "phronexus.retention.main"]

  # On-demand check: scans the Iceberg tables and prints landed row counts.
  #   docker compose --profile iceberg run --rm iceberg-validate
  iceberg-validate:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: ["iceberg"]
    depends_on:
      iceberg-rest: {condition: service_healthy}
    environment:
      PHRONEXUS_BACKEND: aerospike
      PHRONEXUS_AEROSPIKE__HOSTS: aerospike:3000
      PHRONEXUS_AEROSPIKE__USE_NATIVE_TXN: "false"
      PHRONEXUS_CONTRACTS__REFRESH_SECONDS: "5"
      PHRONEXUS_ICEBERG__BACKEND: iceberg
      PHRONEXUS_ICEBERG__CATALOG_URI: http://iceberg-rest:8181
      PHRONEXUS_ICEBERG__WAREHOUSE: s3://warehouse/
      PHRONEXUS_ICEBERG__S3_ENDPOINT: http://minio:9000
      PHRONEXUS_ICEBERG__S3_REGION: us-east-1
      PHRONEXUS_ICEBERG__S3_ACCESS_KEY_ID: phronexus
      PHRONEXUS_ICEBERG__S3_SECRET_ACCESS_KEY: phronexus-secret
      PHRONEXUS_OBSERVABILITY__LOG_LEVEL: WARNING
    command: ["python", "-m", "phronexus.retention.validate"]
