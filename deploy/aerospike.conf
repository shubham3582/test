# Minimal single-node dev config for the `phronexus` namespace.
service {
    cluster-name phronexus     # required by Aerospike 7.1+
    proto-fd-max 15000
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        port 3001
    }
}

namespace phronexus {
    replication-factor 1
    default-ttl 0                 # projections manage their own TTL per contract
    nsup-period 120               # run the supervisor so per-record TTLs (dedup
                                  # markers) are honored/expired instead of rejected
    storage-engine memory {
        data-size 1G
    }
}
